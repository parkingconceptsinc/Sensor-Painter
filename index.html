<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><meta name="description" content="Lienzo generativo controlado por sensores del teléfono."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><title>Sensor Painter</title></head><body><header><div><h1>Sensor Painter</h1><span id="status">Listo</span></div><div class="actions"><button id="activate" class="primary">Activar sensores</button><button id="clear">Limpiar capa</button><button id="undo">Deshacer</button><button id="redo">Rehacer</button><button id="save">PNG</button></div></header><main><section class="stage"><canvas id="paint" aria-label="Lienzo de pintura"></canvas><div class="hud"><span id="sensorState">Sin sensores</span><span id="fps">0 FPS</span></div></section><aside><details><summary>Cámara</summary><div class="cameraBar"><button id="cameraToggle" type="button">Activar cámara</button><button id="cameraSwitch" type="button" disabled>Cambiar cámara</button><button id="cameraCapture" type="button" disabled>Capturar como capa</button></div><video id="cameraVideo" playsinline autoplay muted hidden></video><label>Efecto cámara<select id="cameraEffect"><option value="normal">Normal</option><option value="grayscale">Escala de grises</option><option value="brightness">Brillo</option><option value="contrast">Contraste</option><option value="invert">Invertir</option><option value="sepia">Sepia</option><option value="saturate">Saturación</option><option value="pixelate">Pixelación</option></select></label><label>Intensidad cámara<input id="cameraEffectAmount" type="range" min="0" max="1" step=".01" value=".6"></label><label>Sensor que modula el efecto<select id="cameraSensor"><option value="none">Manual</option><option value="motion">Movimiento</option><option value="tilt">Inclinación</option><option value="light">Luz ambiente</option><option value="heading">Brújula</option></select></label><label class="check"><input id="cameraMirror" type="checkbox" checked> Espejo cámara frontal</label><label class="check"><input id="cameraPaintLink" type="checkbox"> Cámara modula tamaño del pincel</label><label>Sensor para pincel + cámara<select id="cameraPaintSensor"><option value="motion">Movimiento</option><option value="tilt">Inclinación</option><option value="light">Luz ambiente</option><option value="heading">Brújula</option></select></label><label class="check"><input id="cameraColorLink" type="checkbox"> Cámara + sensor modulan color</label><label class="check"><input id="cameraColorCamera" type="checkbox"> Pincel toma color de la cámara</label><p id="cameraStatus" class="hint">Cámara inactiva</p></details><details open><summary>Presets</summary><div class="presetBar"><input id="presetName" type="text" maxlength="40" placeholder="Nombre del preset" aria-label="Nombre del preset"><button id="presetSave" type="button">Guardar</button></div><div class="presetBar"><select id="presetSelect" aria-label="Preset guardado"><option value="">— Seleccionar —</option></select><button id="presetLoad" type="button">Cargar</button><button id="presetDelete" type="button">Eliminar</button></div></details><details open><summary>Capas</summary><div class="layerBar"><select id="layerSelect" aria-label="Capa activa"></select><button id="addLayer" type="button">+</button><button id="deleteLayer" type="button">−</button></div><label>Opacidad de capa<input id="layerOpacity" type="range" min="0" max="1" step=".01" value="1"></label><label class="check"><input id="layerLocked" type="checkbox"> Bloquear capa</label></details><label>Pincel<select id="brush"><option value="ink">Tinta</option><option value="spray">Spray</option><option value="ribbon">Cinta</option><option value="glow">Glow</option><option value="dots">Puntos</option><option value="wash">Acuarela</option></select></label><div class="row"><label>Color<input id="color" type="color" value="#00d9ff"></label><label>Tamaño<input id="size" type="range" min="2" max="100" value="24"></label></div><label>Opacidad<input id="opacity" type="range" min=".05" max="1" step=".01" value=".72"></label><label>Sensor del pincel<select id="brushSensor"><option value="none">Manual</option><option value="motion">Movimiento</option><option value="tilt">Inclinación</option><option value="light">Luz ambiente</option><option value="heading">Brújula</option><option value="touch">Táctil</option></select></label><label>Color dinámico<select id="brushColorSensor"><option value="none">Manual</option><option value="motion">Movimiento</option><option value="tilt">Inclinación</option><option value="light">Luz ambiente</option><option value="heading">Brújula</option></select></label><label>Comportamiento dinámico<select id="brushBehaviorSensor"><option value="none">Manual</option><option value="motion">Movimiento</option><option value="tilt">Inclinación</option><option value="touch">Táctil</option></select></label><label>Control<select id="driver"><option value="motion">Movimiento</option><option value="tilt">Inclinación</option><option value="heading">Brújula</option><option value="geo">GPS</option><option value="light">Luz ambiente</option><option value="touch">Táctil + sensor</option></select></label><label>Efecto<select id="effect"><option value="normal">Normal</option><option value="trail">Estela</option><option value="mirror">Espejo</option><option value="orbit">Órbita</option><option value="chaos">Caos</option><option value="fade">Desvanecer</option></select></label><label>Sensibilidad<input id="sensitivity" type="range" min=".1" max="3" step=".05" value="1"></label><label>Velocidad<input id="speed" type="range" min=".2" max="3" step=".05" value="1"></label><details open><summary>Estado de sensores</summary><pre id="sensorStatus">—</pre></details><details open><summary>Telemetría</summary><pre id="telemetry">—</pre></details><p class="note">Los sensores dependen del navegador, hardware y permisos. Todo el procesamiento ocurre localmente.</p></aside></main><script src="./app.js"></script></body></html>
